# Included by every location in miru.conf.
#
# Not set once at server level, because nginx inherits proxy_set_header from an
# outer block only when the inner block defines none of its own. Every location
# in miru.conf sets at least one header, so a server-level definition applied to
# exactly nothing — and `Host` silently became $proxy_host, i.e. 127.0.0.1:3001.
#
# That is what broke every Server Action: Next compared the `Origin` of a real
# request from ban-1.tail88f195.ts.net against the host it thought it was
# serving, disagreed with itself, and aborted. Cards read "Couldn't load the
# releases for this" while the API answered the same question with a 200.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
