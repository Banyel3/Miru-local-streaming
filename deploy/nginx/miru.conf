# Miru, served over Tailscale.
#
# One origin for everything. The browser talks only to this host, and nginx
# routes /api to the API and everything else to Next. That is not tidiness: a
# cross-origin setup has broken this project three separate times — a redirect
# to the worker tainted Origin to `null`, an extensionless stream URL made the
# player probe headers cross-origin and attach no provider at all, and the
# worker needed its own CORS allowlist. Same-origin removes the entire class.
#
# Install:
#   sudo cp deploy/nginx/miru.conf /etc/nginx/sites-available/miru
#   sudo ln -sf /etc/nginx/sites-available/miru /etc/nginx/sites-enabled/miru
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    # The tailnet name and the raw address, because MagicDNS does not resolve
    # on every device here — DEPLOYMENT.md records that trap.
    server_name ban-1.tail88f195.ts.net 100.71.150.101;

    # Video is the whole point; none of it should be buffered to disk first.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;

    # A transcode session can take a while to produce its first segment, and a
    # 60s default gateway timeout would kill it just as ffmpeg gets going.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_http_version 1.1;

    # Repeated inside every location on purpose. nginx inherits
    # proxy_set_header from an outer block ONLY when the inner block sets none
    # of its own — and every location here sets at least one, so defining these
    # once at server level meant none of them ever applied. `Host` then fell
    # back to $proxy_host, so Next was told it was serving `127.0.0.1:3001`,
    # decided a genuine request from the tailnet name was cross-origin, and
    # aborted every Server Action. Every card read "Couldn't load the releases
    # for this" while the API answered 200 to the same question.
    #
    # A snippet rather than four copies, so the next location added cannot
    # quietly lose them the same way.

    # Range requests are load-bearing: seeking is the difference between a media
    # server and a download link. Pass them through untouched.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # The transcode worker, same-origin. Without this the player is sent
    # cross-origin to the PC AND via a 302, and a cross-origin redirect taints
    # Origin to `null` — which no allowlist can ever match. That exact failure
    # has cost this project three separate debugging sessions; STATE.md records
    # two of them. Proxying it here removes the possibility rather than
    # configuring around it.
    # Mounted at /hls/ — the path the worker itself uses — because it answers
    # /hls?src=... with a 302 to /hls/{session}/master.m3u8. That Location is an
    # absolute path with no prefix, so proxying at /worker/ meant the redirect
    # escaped the proxy, fell through to Next and 404'd into "Nothing here".
    # Matching the upstream's own path space means its redirects stay inside it.
    location /hls {
        proxy_pass http://100.67.44.13:8010/hls;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
        proxy_set_header Range $http_range;
        # Segments are immutable once written; the playlist is not.
        proxy_buffering off;
    }

    # Kept for health checks and anything else on the worker.
    location /worker/ {
        proxy_pass http://100.67.44.13:8010/;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
        proxy_set_header Range $http_range;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
        # Next's dev websocket, and anything else that upgrades.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
