# Miru's public door — the backend Tailscale Funnel forwards to.
#
#   public visitor ──TLS──▶ tailscaled (Funnel) ──▶ 127.0.0.1:8081 (this block)
#   tailnet device ─────────────────────────────▶ 100.71.150.101:80 (miru.conf,
#                                                  ungated, unchanged)
#
# Same app, second listen socket, one difference: every request here must
# carry a valid session cookie. Enforcement is nginx auth_request against
# /api/auth/check — ONE gate by location, so a route added tomorrow is gated
# by default instead of remembering to opt in.
#
# 401 behaviour differs by location, deliberately. Page navigations redirect
# to /login; /api and /hls answer plain 401 — an expired session mid-stream
# must surface as a status the player can react to, not login HTML where JSON
# was expected. That HTML-instead-of-data shape is this repo's most expensive
# recorded failure class.
#
# Install:
#   sudo cp deploy/nginx/miru-public.conf /etc/nginx/sites-available/miru-public
#   sudo ln -sf /etc/nginx/sites-available/miru-public /etc/nginx/sites-enabled/miru-public
#   sudo nginx -t && sudo systemctl reload nginx
#   tailscale funnel --bg 8081
#
# Gate checklist (run after every change to this file — the gate has no
# pytest): see docs/DEPLOYMENT.md "Going public".

server {
    listen 127.0.0.1:8081;

    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;

    # The gate. Applies to every location that does not opt out below.
    auth_request /_miru_auth;

    location = /_miru_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/check;
        # The subrequest must not forward the original body — auth_request
        # cannot carry one, and without these two lines Server Action POSTs
        # hang waiting on a Content-Length that never arrives.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # -- Open: the login flow itself, and the assets its page needs. --------

    location /login {
        auth_request off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # JS/CSS chunks only — data never lives under /_next/static.
    location /_next/ {
        auth_request off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
    }

    location /api/auth/ {
        auth_request off;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
        # tailscaled connects from loopback and sets the real client address
        # in X-Forwarded-For; the API trusts it only from loopback. It feeds
        # the per-IP rate limit — without it every stranger shares one bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -- Gated: everything else, same upstreams as the tailnet block. -------

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location /hls {
        proxy_pass http://100.67.44.13:8010/hls;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
        proxy_set_header Range $http_range;
        proxy_buffering off;
    }

    # No public /worker/ — health checks are a tailnet concern.

    location / {
        # Browsers navigating get sent to sign in; fetches under /api and
        # /hls above keep their bare 401.
        error_page 401 = @to_login;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/miru-proxy-headers.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @to_login {
        return 302 /login;
    }
}
