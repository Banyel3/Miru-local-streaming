[project]
name = "miru-worker"
version = "0.1.0"
description = "Miru transcode worker — ffmpeg/NVENC to HLS. No database, no domain models."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["miru_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
