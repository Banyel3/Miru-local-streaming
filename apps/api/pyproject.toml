[project]
name = "miru-api"
version = "0.1.0"
description = "Miru — personal self-hosted media server"
requires-python = ">=3.11"
dependencies = [
    # 0.45 is the first release whose FileResponse handles Range requests.
    # Streaming correctness depends on it — see tests/test_range.py.
    "starlette>=0.45",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Release-name parsing. anitopy is the Python port of Anitomy, which is what
    # anime clients use for the "[Group] Title - 01 [1080p][HASH]" shape;
    # guessit handles scene and p2p naming. Each is poor at the other's shape,
    # so they are routed by kind rather than chained.
    "anitopy>=2.1",
    "guessit>=3.8",
    # Schema changes. create_all() can add a table but never alter one, and the
    # catalogue accumulates — the 669 releases in it cannot be rebuilt by
    # rescanning, because Prowlarr only ever shows its front page.
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["miru*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
